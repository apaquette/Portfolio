name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy:
    name: Deploy to Azure Static Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      - name: Restore and build for deployment
        run: |
          dotnet restore ./src/Portfolio
          dotnet build ./src/Portfolio --configuration Release --no-restore

      - name: Select deployment token
        id: token
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "Using production deployment token"
<<<<<<< HEAD
            echo "token=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" >> $GITHUB_OUTPUT
=======
            echo "token=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_STONE_07501540F }}" >> $GITHUB_OUTPUT
>>>>>>> dev
          elif [ "${{ github.ref_name }}" == "dev" ]; then
            echo "Using development deployment token"
            echo "token=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DEV }}" >> $GITHUB_OUTPUT
          else
            echo "Branch not recognized for deployment"
            exit 1
          fi
      
      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/src/Portfolio"
          api_location: ""
          output_location: "wwwroot"

